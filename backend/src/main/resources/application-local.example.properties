# Copy this file to application-local.properties and fill in your own values.
# Run the backend with: SPRING_PROFILES_ACTIVE=local
#
# Use the IPv4 pooler host (the direct db.<ref>.supabase.co host is often IPv6-only).
# For the Supabase transaction pooler, use port 6543. Keep prepareThreshold=0
# because the transaction pooler does not support server-side prepared statements.
spring.application.name=attendance

spring.datasource.url=jdbc:postgresql://<your-region>.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.<your-project-ref>
spring.datasource.password=<your-db-password>

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
