spring.application.name=attendance

# Supabase PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# External APIs
fastapi.url=${FASTAPI_URL:http://localhost:8000}

# Security
jwt.secret=${JWT_SECRET:supersecretkeythatneedstobeatleast256bitslong12345}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
proctor.username=${PROCTOR_USERNAME:proctor}
proctor.password=${PROCTOR_PASSWORD:proctor123}
lead.proctor.username=${LEAD_PROCTOR_USERNAME:admin}
lead.proctor.password=${LEAD_PROCTOR_PASSWORD:admin123}
management.endpoints.web.exposure.include=health,info
